<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .bar { fill: #161b22; rx: 12px; }
      .bar-mask { fill: #161b22; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .txt { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 13px; fill: #c9d1d9; }
      .cyan { fill: #58a6ff; font-weight: bold; }
