name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'CODE_SCAFFOLDING/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'CODE_SCAFFOLDING/frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: CODE_SCAFFOLDING/frontend/package-lock.json

      - name: Install dependencies
        working-directory: CODE_SCAFFOLDING/frontend
        run: npm ci

      - name: Lint
        working-directory: CODE_SCAFFOLDING/frontend
        run: npm run lint

      - name: Build Next.js
        working-directory: CODE_SCAFFOLDING/frontend
        run: npm run build
