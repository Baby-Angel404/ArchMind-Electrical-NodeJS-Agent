name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'CODE_SCAFFOLDING/backend-nodejs/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'CODE_SCAFFOLDING/backend-nodejs/**'
      - '.github/workflows/backend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: CODE_SCAFFOLDING/backend-nodejs/package-lock.json

      - name: Install dependencies
        working-directory: CODE_SCAFFOLDING/backend-nodejs
        run: npm ci

      - name: Static Analysis & Lint
        working-directory: CODE_SCAFFOLDING/backend-nodejs
        run: npm run lint

      - name: Typecheck
        working-directory: CODE_SCAFFOLDING/backend-nodejs
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: CODE_SCAFFOLDING/backend-nodejs
        run: npm test

      - name: Build Application
        working-directory: CODE_SCAFFOLDING/backend-nodejs
        run: npm run build
