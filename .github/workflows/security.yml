name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend npm audit
        working-directory: CODE_SCAFFOLDING/backend-nodejs
        run: npm audit --audit-level=high

      - name: Frontend npm audit
        working-directory: CODE_SCAFFOLDING/frontend
        run: npm audit --audit-level=high
